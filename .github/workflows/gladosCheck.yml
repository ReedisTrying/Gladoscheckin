name: auto check

on:
  workflow_dispatch:
    inputs:
      status_only:
        description: '仅查询账户状态（不签到）'
        type: boolean
        default: false
      notify:
        description: '手动运行时发送 PushDeer 通知'
        type: boolean
        default: false

  pull_request:
    paths:
      - 'checkin.py'
      - 'browser_checkin.py'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/**'

  push:
    branches:
      - master
    paths-ignore:
      - 'README.md'
      - 'imgs/**'

  schedule:
    - cron: '7 12,18 * * *'
      timezone: 'Asia/Shanghai'


concurrency:
  group: glados-checkin-${{ github.ref }}
  cancel-in-progress: false


jobs:

  test:
    name: Regression tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v

  checkin:
    name: glados checkin
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: windows-latest

    timeout-minutes: 10

    permissions:
      contents: read

    steps:

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run GLaDOS checkin
        run: python checkin.py
        env:
          PYTHONUTF8: '1'
          CHECKIN_MODE: browser
          GLADOS_BROWSER_CHANNEL: chrome
          GLADOS_BROWSER_HEADLESS: 'false'
          SENDKEY: ${{ (github.event_name != 'workflow_dispatch' || inputs.notify) && secrets.SENDKEY || '' }}
          COOKIES: ${{ secrets.COOKIES }}
          USER_AGENTS: ${{ secrets.USER_AGENTS }}
          CHECKIN_STATUS_ONLY: ${{ inputs.status_only || false }}


  keepalive:
    name: Keep workflow alive

    if: github.event_name == 'schedule'

    runs-on: ubuntu-latest

    permissions:
      actions: write
      contents: read

    steps:

      - name: Keep scheduled workflow alive
        uses: liskin/gh-workflow-keepalive@v1


  cleanup:
    name: Delete old workflow runs

    if: always() && github.ref == 'refs/heads/master' && github.event_name != 'pull_request'

    needs:
      - checkin

    runs-on: ubuntu-latest

    permissions:
      actions: write
      contents: read

    steps:

      - name: Delete old workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 7
          keep_minimum_runs: 10
          delete_run_by_conclusion_pattern: success
