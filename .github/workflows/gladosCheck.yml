name: auto check

on:
  # 支持手动运行
  workflow_dispatch:

  # 修改代码后自动运行
  push:
    branches:
      - master
    paths-ignore:
      - 'README.md'
      - 'imgs/**'

  # 每天北京时间 12:07 和 18:07 自动运行
  # 故意避开整点，降低 GitHub Actions 高峰期延迟概率
  schedule:
    - cron: '7 12,18 * * *'
      timezone: 'Asia/Shanghai'


# 防止多个签到任务同时运行
concurrency:
  group: glados-checkin
  cancel-in-progress: false


jobs:

  # ------------------------------------------------------------
  # GLaDOS 签到
  # ------------------------------------------------------------
  checkin:
    name: glados checkin
    runs-on: ubuntu-latest

    timeout-minutes: 10

    permissions:
      contents: read

    steps:

      # 拉取仓库代码
      - name: Checkout repository
        uses: actions/checkout@v7

      # 安装 Python
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # 安装依赖
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pypushdeer

      # 执行签到
      - name: Run GLaDOS checkin
        run: python checkin.py
        env:
          SENDKEY: ${{ secrets.SENDKEY }}
          COOKIES: ${{ secrets.COOKIES }}


  # ------------------------------------------------------------
  # 防止 GitHub 因仓库长期无活动关闭定时任务
  # 只在 schedule 定时触发时执行
  # ------------------------------------------------------------
  keepalive:
    name: Keep workflow alive

    if: github.event_name == 'schedule'

    runs-on: ubuntu-latest

    permissions:
      actions: write
      contents: read

    steps:

      - name: Keep scheduled workflow alive
        uses: liskin/gh-workflow-keepalive@v1


  # ------------------------------------------------------------
  # 清理旧的 Actions 运行记录
  # 即使签到失败也可以执行
  # ------------------------------------------------------------
  cleanup:
    name: Delete old workflow runs

    if: always()

    needs:
      - checkin

    runs-on: ubuntu-latest

    permissions:
      actions: write
      contents: read

    steps:

      - name: Delete old workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 7
          keep_minimum_runs: 10
          delete_run_by_conclusion_pattern: success
