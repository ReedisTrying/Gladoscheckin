name: GLaDOS validation

on:
  workflow_dispatch:
    inputs:
      status_only:
        description: '仅查询账户状态（不签到）'
        type: boolean
        default: false
      notify:
        description: '手动运行时发送 PushDeer 通知'
        type: boolean
        default: false
      browser_channel:
        description: '独立浏览器'
        type: choice
        default: chrome
        options:
          - chrome
          - msedge

  pull_request:
    paths:
      - 'checkin.py'
      - 'browser_checkin.py'
      - 'local_checkin.py'
      - 'run_local.py'
      - 'install_local.ps1'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/**'

  push:
    branches:
      - master
    paths-ignore:
      - 'README.md'
      - 'imgs/**'



concurrency:
  group: glados-checkin-${{ github.ref }}
  cancel-in-progress: false


jobs:

  test:
    name: Regression tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q checkin.py browser_checkin.py local_checkin.py run_local.py

  checkin:
    name: glados checkin
    needs: test
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest

    timeout-minutes: 10

    permissions:
      contents: read

    steps:

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run GLaDOS checkin
        run: python checkin.py
        env:
          PYTHONUTF8: '1'
          GLADOS_BASE_URL: https://glados.network
          CHECKIN_MODE: browser
          GLADOS_BROWSER_CHANNEL: ${{ inputs.browser_channel || 'chrome' }}
          GLADOS_BROWSER_HEADLESS: 'false'
          SENDKEY: ${{ (github.event_name != 'workflow_dispatch' || inputs.notify) && secrets.SENDKEY || '' }}
          COOKIES: ${{ secrets.COOKIES }}
          USER_AGENTS: ${{ secrets.USER_AGENTS }}
          CHECKIN_STATUS_ONLY: ${{ inputs.status_only || false }}
